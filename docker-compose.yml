services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    volumes:
      - timingplans:/app/data
      - ./simulation:/simulation
    environment:
      DATABASE_URL: postgresql+asyncpg://traffic:traffic@database:5432/traffic
    ports: ["8000:8000"]
    depends_on: [database]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  pgdata:
  timingplans:
